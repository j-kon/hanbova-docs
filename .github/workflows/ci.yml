name: Hanbova Documentation CI

on:
  push:
    branches: [ main, 'milestone/**' ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    name: Documentation Integrity & Structure Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Core Documentation Structure
        run: |
          test -f README.md
          test -f architecture.md
          test -f threat-model.md
          test -f product.md
          test -f roadmap.md
          test -f development.md
          test -f presentation.md
          echo "All core documentation files verified!"
